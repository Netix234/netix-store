<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Оформлення замовлення | NETIX STORE</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<a href="index.html" class="logo">
NETIX STORE
</a>

</header>

<section class="checkout">

<h1>Оформлення замовлення</h1>

<div class="form-box">

<input id="name" type="text" placeholder="Ваше ім'я" required>

<input id="phone" type="tel" placeholder="Номер телефону" required>

<h3>Спосіб доставки</h3>

<label>
<input type="radio" name="delivery" value="nova" onclick="nova()" checked>
Нова Пошта
</label>

<label>
<input type="radio" name="delivery" value="ukr" onclick="ukr()">
Укрпошта
</label>

<div id="nova">

<input id="novaPlace"
type="text"
placeholder="Номер відділення або поштомату">

</div>

<div id="ukr" style="display:none;">

<input id="ukrPlace"
type="text"
placeholder="Поштовий індекс">

</div>

<input
id="city"
type="text"
placeholder="Місто"
required>

<textarea
id="comment"
placeholder="Коментар до замовлення">
</textarea>

<button class="order-btn" onclick="sendOrder()">

Підтвердити замовлення

</button>

</div>

</section>

<script>

function nova(){

document.getElementById("nova").style.display="block";
document.getElementById("ukr").style.display="none";

}

function ukr(){

document.getElementById("nova").style.display="none";
document.getElementById("ukr").style.display="block";

}

const BOT_TOKEN="8627514379:AAGgX7-Kgyzw1dbaBI0U2AEjVjMZkAWtK8I";

const CHAT_ID="7999613061";

function sendOrder(){

const name=document.getElementById("name").value;

const phone=document.getElementById("phone").value;

const city=document.getElementById("city").value;

const comment=document.getElementById("comment").value||"-";

let delivery="";
let place="";

if(document.querySelector('input[value="nova"]:checked')){

delivery="Нова Пошта";

place=document.getElementById("novaPlace").value;

}

if(document.querySelector('input[value="ukr"]:checked')){

delivery="Укрпошта";

place=document.getElementById("ukrPlace").value;

}

let cart=JSON.parse(localStorage.getItem("cart"))||[];

if(cart.length===0){

alert("Кошик порожній!");

return;

}

let products="";

let total=0;

cart.forEach(item=>{

products+=`• ${item.name} — ${item.price} грн\n`;

total+=Number(item.price);

});

const text=`🛒 НОВЕ ЗАМОВЛЕННЯ

👤 Ім'я:
${name}

📞 Телефон:
${phone}

🏙️ Місто:
${city}

🚚 Доставка:
${delivery}

📍 Відділення:
${place}

──────────────

📦 ТОВАРИ

${products}

──────────────

💰 Разом:
${total} грн

──────────────

📝 Коментар:
${comment}`;

fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

chat_id:CHAT_ID,

text:text

})

})

.then(()=>{

alert("Замовлення успішно відправлено!");

localStorage.removeItem("cart");

window.location.href="index.html";

})

.catch(()=>{

alert("Помилка відправки!");

});

}

</script>

</body>
</html>
